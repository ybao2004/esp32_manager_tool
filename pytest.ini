[pytest]
testpaths = tests
python_files = test_*.py
python_classes = *Tests Test*
python_functions = test_*
addopts = -v --tb=short -ra
markers =
    tier1: Feature coverage happy path tests
    tier2: Boundary and corner error handling tests
    tier3: Cross-feature interaction and mutex locking tests
    tier4: Real-world end-to-end workflow tests
    mock_hw: Tests utilizing mock hardware infrastructure
